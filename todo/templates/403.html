<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        @import url("https://fonts.googleapis.com/css?family=Raleway:400,400i,700");

* {
  font-family: Raleway, sans-serif;
}

html,
body,
.container {
  width: 100%;
  height: 100%;
  padding: 0;
  margin: 0;
}

.container {
  background: #2f2f2f;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-wrap: wrap;
}

.content {
  margin: 20px;
}

.mask {
  display: block;
  /* animation: mask 1s infinite; */
  mask-image: url(https://i.postimg.cc/kgBSj8Zz/Masquerade.png);
  mask-repeat: no-repeat;
  -webkit-mask-image: url(https://i.postimg.cc/kgBSj8Zz/Masquerade.png);
  -webkit-mask-repeat: no-repeat;
}

.text-center {
  text-align: center;
}

.color-white-shadow {
  color: #fff;
  text-shadow: 0 -1px #0f0f0f;
}



    </style>
</head>
<body>
    <div class="container">
  <div class="content">
    <h2 class="color-white-shadow text-center">403 Forbidden<br><small>Access denied</small></h2>
    <img src="https://images.unsplash.com/photo-1506202687253-52e1b29d3527?ixlib=rb-0.3.5&s=b43d68ed98b673427669234757d85e56&auto=format&fit=crop&w=300&q=80" width="300" height="140" class="mask">
    <p class="color-white-shadow text-center">You are not allowed to access this account<br>Because it's in private mode.</p>
  </div>
</div>
</body>
</html>
